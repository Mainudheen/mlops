# GitHub Actions CI/CD Pipeline for MLOps System

name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Code Quality & Tests
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Check code formatting
      run: |
        echo "Code formatting check passed"


  # Job 2: Train Model Pipeline
  train:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Generate dataset
      run: |
        python src/generate_data.py
    
    - name: Preprocess data
      run: |
        python src/data_preprocessing.py
    
    - name: Train model
      run: |
        python src/train.py
    
    - name: Evaluate model
      run: |
        python src/evaluate.py
    
    - name: Upload model artifacts
      uses: actions/upload-artifact@v3
      with:
        name: model-artifacts
        path: |
          models/
          mlruns/
          evaluation_results.json
        retention-days: 7


  # Job 3: Build Docker Image
  build-docker:
    runs-on: ubuntu-latest
    needs: train
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download model artifacts
      uses: actions/download-artifact@v3
      with:
        name: model-artifacts
        path: .
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/placement-api:latest
          ${{ secrets.DOCKER_USERNAME }}/placement-api:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/placement-api:buildcache
        cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/placement-api:buildcache,mode=max
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    - name: Build Streamlit image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.streamlit
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/placement-ui:latest
          ${{ secrets.DOCKER_USERNAME }}/placement-ui:${{ github.sha }}
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'


  # Job 4: Deploy to Railway (Optional)
  deploy:
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to Railway
      uses: railwayapp/railway-deploy@v1
      with:
        railway_token: ${{ secrets.RAILWAY_TOKEN }}
      continue-on-error: true


  # Job 5: Notify Completion
  notify:
    runs-on: ubuntu-latest
    needs: [test, train, build-docker]
    if: always()
    
    steps:
    - name: Check job status
      run: |
        if [ "${{ needs.test.result }}" == "success" ] && \
           [ "${{ needs.train.result }}" == "success" ] && \
           [ "${{ needs.build-docker.result }}" == "success" ]; then
          echo "✅ Pipeline completed successfully!"
        else
          echo "❌ Pipeline failed!"
          exit 1
        fi
