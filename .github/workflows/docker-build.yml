# GitHub Actions Workflow - Docker Build in Cloud
# Builds Docker image without requiring Docker locally

name: Docker Build CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    # Step 1: Checkout repository code
    - name: Checkout code
      uses: actions/checkout@v3
    
    # Step 2: Set up Docker Buildx (GitHub Actions has Docker pre-installed)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    # Step 3: Build Docker image (no push yet)
    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile
        push: false
        tags: placement-api:${{ github.sha }}
        cache-from: type=registry,ref=placement-api:buildcache
        cache-to: type=local,dest=/tmp/build-cache
    
    # Step 4: Verify build success
    - name: Verify Docker build
      run: |
        echo "✅ Docker build completed successfully!"
        echo "Image tagged as: placement-api:${{ github.sha }}"
    
