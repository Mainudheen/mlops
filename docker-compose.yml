# Docker Compose for MLOps System
# Includes FastAPI, Streamlit, and supporting services

version: '3.8'

services:
  # FastAPI Backend
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: placement-api
    ports:
      - "8000:8000"
    environment:
      - FASTAPI_ENV=production
      - MLFLOW_TRACKING_URI=file:/app/mlruns
    volumes:
      - ./mlruns:/app/mlruns
      - ./models:/app/models
      - ./data:/app/data
    networks:
      - mlops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Streamlit Frontend
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: placement-ui
    ports:
      - "8501:8501"
    environment:
      - FASTAPI_URL=http://fastapi:8000
      - STREAMLIT_SERVER_PORT=8501
    depends_on:
      - fastapi
    networks:
      - mlops-network
    restart: unless-stopped

  # MLflow Tracking Server
  mlflow:
    image: python:3.10-slim
    container_name: mlflow-server
    command: >
      bash -c "pip install mlflow dagshub && 
               mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    working_dir: /app
    networks:
      - mlops-network
    profiles:
      - full

networks:
  mlops-network:
    driver: bridge

volumes:
  mlruns:
  models:
  data:
